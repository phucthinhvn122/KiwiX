name: ExtensionBrowser

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.4"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    # TARGETED_DEVICE_FAMILY is deliberately NOT here. XcodeGen writes its own copy into every iOS
    # target, and a target setting beats a project one, so a value in this block is silently
    # overridden — the shipped app carried UIDeviceFamily [1, 2] with "1" written right here. It
    # belongs in each target's own settings block, where it wins.
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    SWIFT_STRICT_CONCURRENCY: targeted
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  ExtensionBrowser:
    type: application
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: ExtensionBrowser
        excludes:
          - Resources
      - path: ExtensionBrowser/Resources
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER)"
        BUNDLE_IDENTIFIER: com.phucthinhvn122.KiwiX
        # iPhone only, and it has to be stated at target level to take effect — see the note in the
        # project-level block. The CI step "Verify the built app is iPhone-only" reads it back out of
        # the built Info.plist, because the last person to write it in the wrong place was not told.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: ExtensionBrowser
        PRODUCT_MODULE_NAME: ExtensionBrowser
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        APPLE_TEAM_ID: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ExtensionBrowser/Resources/Info.plist
      properties:
        CFBundleDisplayName: KiwiX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # App Transport Security governs WKWebView, not just URLSession, and the only exemption
          # here was for local names. A browser that cannot open http://example.com is not a
          # browser: the load fails with NSURLErrorAppTransportSecurityRequiresSecureConnection and
          # the user gets the error view. URLInputParser even produces http URLs deliberately
          # (localhost, bare IPv4, host:port), which ATS was then rejecting.
          #
          # InWebContent, not NSAllowsArbitraryLoads. This exempts page loads only; every native
          # request the app makes itself stays under ATS, which matters because the one native
          # network client is the favicon fetcher, reading URLs chosen by web content. It also
          # keeps NetworkDestinationPolicy's refusal to downgrade https -> http meaningful.
          NSAllowsArbitraryLoadsInWebContent: true
        # Exported, not Imported: com.extensionbrowser.* is a prefix this app owns, and an
        # imported declaration claims the opposite.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.extensionbrowser.web-extension
            UTTypeDescription: Web Extension Package
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - zip
          # A CRX3 file is not a ZIP: it opens with `Cr24`, a protobuf header, then the archive.
          # Declaring it as conforming to public.zip-archive would be a lie the system acts on, so
          # it gets its own type that conforms to public.data.
          - UTTypeIdentifier: com.extensionbrowser.crx-extension
            UTTypeDescription: Chrome Extension Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - crx
              public.mime-type:
                - application/x-chrome-extension
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web Extension Package
            CFBundleTypeRole: Viewer
            # Alternate, not Owner: a .zip belongs to whatever the user normally opens zips with,
            # and KiwiX only wants to appear in the share sheet.
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.extensionbrowser.web-extension
              - com.extensionbrowser.crx-extension
  ExtensionBrowserTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: ExtensionBrowserTests
      # Shared with the UI-test target: ScreenInk measures pixels, and both targets need it —
      # one photographs the running app, the other renders a view in-process.
      - path: TestSupport
      - path: Benchmarks
      # Copied verbatim so an extension keeps its on-disk layout; WKWebExtension needs a real
      # directory with a manifest at its root.
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ExtensionBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ExtensionBrowserTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ExtensionBrowser.app/ExtensionBrowser"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ExtensionBrowserUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: ExtensionBrowserUITests
      # Shared with the unit-test target; see the note there.
      - path: TestSupport
    dependencies:
      - target: ExtensionBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ExtensionBrowserUITests
        GENERATE_INFOPLIST_FILE: true
        # A UI test drives the app from outside its process, so there is no TEST_HOST and no
        # BUNDLE_LOADER here: nothing is linked against, the app is launched and tapped.
        TEST_TARGET_NAME: ExtensionBrowser

schemes:
  ExtensionBrowser:
    build:
      targets:
        ExtensionBrowser: all
        ExtensionBrowserTests:
          - test
        ExtensionBrowserUITests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - name: ExtensionBrowserTests
          parallelizable: false
          randomExecutionOrder: false
        # Ordered after the unit suite on purpose: if a unit test already explains the failure,
        # nobody should have to read a UI test log to find that out.
        - name: ExtensionBrowserUITests
          parallelizable: false
          randomExecutionOrder: false
    run:
      config: Debug
    archive:
      config: Release
