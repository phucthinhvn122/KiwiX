name: ExtensionBrowser

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.4"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    SWIFT_STRICT_CONCURRENCY: targeted
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  ExtensionBrowser:
    type: application
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: ExtensionBrowser
        excludes:
          - Resources
      - path: ExtensionBrowser/Resources
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER)"
        BUNDLE_IDENTIFIER: com.phucthinhvn122.KiwiX
        PRODUCT_NAME: ExtensionBrowser
        PRODUCT_MODULE_NAME: ExtensionBrowser
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        APPLE_TEAM_ID: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ExtensionBrowser/Resources/Info.plist
      properties:
        CFBundleDisplayName: KiwiX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.extensionbrowser.web-extension
            UTTypeDescription: Web Extension Package
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - zip
  ExtensionBrowserTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.4"
    sources:
      - path: ExtensionBrowserTests
      - path: Benchmarks
      # Copied verbatim so an extension keeps its on-disk layout; WKWebExtension needs a real
      # directory with a manifest at its root.
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ExtensionBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ExtensionBrowserTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ExtensionBrowser.app/ExtensionBrowser"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ExtensionBrowser:
    build:
      targets:
        ExtensionBrowser: all
        ExtensionBrowserTests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - name: ExtensionBrowserTests
          parallelizable: false
          randomExecutionOrder: false
    run:
      config: Debug
    archive:
      config: Release
