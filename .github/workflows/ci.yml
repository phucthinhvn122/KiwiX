name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, benchmark, and package
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT: ExtensionBrowser.xcodeproj
      SCHEME: ExtensionBrowser
      BUNDLE_IDENTIFIER: com.phucthinhvn122.KiwiX
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify pinned Xcode
        run: |
          set -euo pipefail
          test -x "${DEVELOPER_DIR}/usr/bin/xcodebuild"
          xcodebuild -version | grep -F "Xcode 16.4"

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install pinned XcodeGen
        run: bash scripts/ci/install-xcodegen.sh

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project "${PROJECT}" -list

      - name: Select iPhone Simulator
        id: simulator
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          udid="$(xcrun simctl list devices available --json | /usr/bin/python3 scripts/ci/select-simulator.py --maximum-runtime "${sdk_version}")"
          echo "udid=${udid}" >> "${GITHUB_OUTPUT}"
          echo "Selected simulator: ${udid} (maximum runtime ${sdk_version})"

      - name: Boot selected Simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "${SIMULATOR_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          # Dark is where the address-bar defect lived: the field's background follows the
          # interface style and the text colour did not. The UI-test screenshots are taken in the
          # mode that hid the bug. Light mode is covered arithmetically, on both styles, by
          # BrowserChromeAppearanceTests.
          xcrun simctl ui "${SIMULATOR_UDID}" appearance dark

      - name: Check source for private API
        run: make private-api

      - name: Verify no advertising SDKs are present
        run: make ad-free

      - name: Run tests
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}
        run: make test DESTINATION="${DESTINATION}" TEST_RESULT_BUNDLE_PATH="build/Tests.xcresult"

      - name: Export UI-test screenshots
        if: ${{ always() }}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/ci/export_screenshots.py             --xcresult build/Tests.xcresult             --output artifacts/screenshots

      - name: Build release Simulator app
        run: make build CONFIGURATION=Release DESTINATION="generic/platform=iOS Simulator" DERIVED_DATA="build/simulator"

      - name: Check built binary for private API
        run: bash scripts/check_private_api.sh --binary "build/simulator/Build/Products/Release-iphonesimulator/ExtensionBrowser.app/ExtensionBrowser"

      - name: Run M0 benchmark
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}
        run: make bench DESTINATION="${DESTINATION}" RESULT_BUNDLE_PATH="build/Benchmarks.xcresult"

      - name: Package unsigned IPA
        run: make ipa

      - name: Package Simulator app
        run: |
          set -euo pipefail
          app_path="build/simulator/Build/Products/Release-iphonesimulator/ExtensionBrowser.app"
          mkdir -p artifacts/simulator
          ditto -c -k --sequesterRsrc --keepParent "${app_path}" artifacts/simulator/ExtensionBrowser-Simulator.zip
          unzip -t artifacts/simulator/ExtensionBrowser-Simulator.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: KiwiX-${{ github.sha }}
          path: |
            artifacts/simulator/ExtensionBrowser-Simulator.zip
            artifacts/ipa/ExtensionBrowser-Unsigned.ipa
            build/Tests.xcresult
            build/Benchmarks.xcresult
            artifacts/screenshots
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: KiwiX-Diagnostics-${{ github.sha }}
          path: |
            build/**/*.xcresult
            build/**/*.log
            artifacts/screenshots
          if-no-files-found: warn
          retention-days: 7
